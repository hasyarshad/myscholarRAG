# Database plus API in containers:
#
#   docker compose -f docker/compose.yaml up --build
#
# This stack runs its own empty Postgres on port 5434, separate from the
# development database on 5433. Load the local index into it with
# `make compose-restore`.

name: myscholar

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: myscholar
      POSTGRES_PASSWORD: myscholar
      POSTGRES_DB: myscholar
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myscholar -d myscholar"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      # 8001, so it doesn't clash with `myscholar serve` on 8000.
      - "8001:8080"
    environment:
      MYSCHOLAR_DATABASE__URL: postgresql+asyncpg://myscholar:myscholar@db:5432/myscholar

      # Defaults to the fake model, which needs no key or network. To use a real
      # one, set MYSCHOLAR_LLM__PROVIDER=openai_compatible and MYSCHOLAR_LLM__API_KEY.
      MYSCHOLAR_LLM__PROVIDER: ${MYSCHOLAR_LLM__PROVIDER:-fake}
      MYSCHOLAR_LLM__API_KEY: ${MYSCHOLAR_LLM__API_KEY:-}

      # The database starts empty, so the API creates the schema.
      MYSCHOLAR_DATABASE__MIGRATE_ON_STARTUP: "true"
    depends_on:
      db:
        # Postgres accepts connections a few seconds before it answers queries.
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
