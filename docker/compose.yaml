# Packaging artifact only.
#
# The development workstation is a shared lab machine with no root access and
# no docker group membership, so this file cannot be exercised there — local
# Postgres runs via scripts/db.sh against a conda-provided binary instead.
#
# This exists so that someone else, on a machine where Docker is available, can
# bring the system up without reproducing the userspace setup. It is verified
# in Phase 7A, not before; until then treat it as untested.

name: myscholar

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: myscholar
      POSTGRES_PASSWORD: myscholar
      POSTGRES_DB: myscholar
    ports:
      # 5433 on the host, so an existing local Postgres on 5432 is untouched.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myscholar -d myscholar"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
