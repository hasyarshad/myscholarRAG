[project]
name = "myscholar"
version = "0.1.0"
description = "Adaptive, citation-grounded RAG over a personal corpus of research papers"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Haseeb Arshad" }]

dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "typer>=0.15",
    "rich>=13.9",
    "structlog>=25.1",
    "httpx>=0.28",
    "pyyaml>=6.0",
    # Persistence is used by both ingestion and serving, so it belongs in the
    # core dependencies rather than in either extra.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
]

[project.optional-dependencies]
# Local development: GPU inference and PDF ingestion. Not installed in production.
local = [
    "ollama>=0.4",
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "torchvision>=0.20",
    "docling>=2.15",
]
# Production runtime: CPU-only ONNX inference plus a hosted LLM.
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
]

# Model export: run once, on a machine with the PyTorch weights, to produce the
# ONNX artifacts that production loads. Never installed in production — the
# point of the export is that the 2GB of PyTorch is not needed to serve.
export = [
    "optimum[onnxruntime]>=1.24",
    "onnx>=1.17",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "hypothesis>=6.123",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-pyyaml>=6.0",
]

[project.scripts]
myscholar = "myscholar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# PyPI's default torch wheel is built against CUDA 13.0, but this machine's
# driver reports 12.8, so that wheel silently falls back to CPU. The RTX 5090
# is Blackwell (sm_120) and needs cu128 specifically — earlier builds don't
# support the architecture, later ones outrun the driver.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# torchvision must come from the same index as torch. A mismatched pair
# installs cleanly and then fails at import with
# "operator torchvision::nms does not exist", because the compiled operators
# are registered against a different torch build.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.hatch.build.targets.wheel]
packages = ["src/myscholar"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ANN",      # annotations — every function is typed
    "PTH",      # prefer pathlib
    "RET",      # return consistency
    "SLF",      # private member access — flags reaching past an interface
    "BLE",      # blind except — each one must be justified with a noqa
]
ignore = [
    "ANN401",   # allow typing.Any where genuinely needed
    "B008",     # typer uses function calls in argument defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
# scripts is included, and was not. The evaluation harness and the export
# tooling import the same domain enums the package does, so a rename that the
# type checker would catch instantly inside src went unnoticed outside it:
# RetrievalMode.FULL was deleted with the cross-encoder reranker and
# scripts/eval_generation.py kept referring to it, so the three-configuration
# evaluation raised AttributeError partway through every run — after the first
# configuration had finished and printed, which is what made it look like a
# completed run rather than a crash. mypy names that line in under a second.
files = ["src", "tests", "scripts"]

# Third-party packages without bundled type stubs.
[[tool.mypy.overrides]]
module = [
    "ollama.*",
    "docling.*",
    "sentence_transformers.*",
    "onnxruntime.*",
    "pgvector.*",
    # Used only by scripts/: the ONNX export and the PDF toolchain.
    "optimum.*",
    "pygments.*",
    "markdown_it.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: needs a live database or model server (excluded by default)",
]
