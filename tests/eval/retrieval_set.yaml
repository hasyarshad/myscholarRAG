# Retrieval test set.
#
# Each question names the document that should be found. Questions are written
# to probe different retrieval behaviours, and the `kind` field records which,
# so the ablation can show *where* each component earns its place rather than
# only that the average moved.
#
#   identifier  — a rare acronym or method name. Dense embeddings split these
#                 into subword pieces and smear them; this is the case the
#                 lexical branch exists for.
#   paraphrase  — the answer uses entirely different words from the question.
#                 Dense search should win; lexical should be useless.
#   topical     — an ordinary subject question, no special difficulty.
#   crossdomain — the three papers outside power electronics, which should not
#                 be crowded out by the seventeen that share a vocabulary.
#
# Expected documents are slugs. Run: uv run python scripts/eval_retrieval.py

