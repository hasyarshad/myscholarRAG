# --- Harder cases -----------------------------------------------------------
#
# The questions above are largely answerable from title words, which saturates
# the benchmark: dense retrieval alone reaches 0.92 hit@1 and there is no room
# left to show what the other components contribute.
#
# These are written to be harder in three specific ways:
#
#   confusable — two papers in the corpus have near-identical titles
#                ("Computationally efficient data-driven MPC for MMC" and
#                "Data Driven MPC for MMC with Reduced Computational
#                 Complexity"). Distinguishing them needs content, not titles.
#   deepcontent — asks about a finding or a detail inside the paper, using no
#                 word from its title.
#   ambiguousdomain — several papers share a vocabulary (MPC, induction motor,
#                 inverter); the question must be resolved on specifics.

- question: "Which converter control work targets reducing computational burden specifically?"
  kind: confusable
  expect: data-driven-model-predictive-control-for-modular-multilevel-converters-with-reduced-computational-complexity

