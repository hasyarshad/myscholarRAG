# Document selection test set.
#
# The other evaluations ask "which passage answers this". This one asks "which
# papers is this question about", which is a different question and the one the
# summariser exists to answer.
#
# It needed writing because nothing measured the stage. The retrieval set was
# written in Phase 2 and is 27 single-paper questions, 9 methodological and no
# cross-paper synthesis at all — so the class selection was built for, and the
# class Haseeb's own questions fall into, was entirely unmeasured.
#
# `expect` lists the documents a good answer would have to draw on. Scoring is
# recall: of those, how many does selection put in scope. Precision is
# deliberately not scored — selecting nine of twenty-five and being wrong about
# two costs a little context, while missing the paper that answers the question
# costs the answer.
#
# Slugs, so a title correction cannot silently invalidate a case.
# Run: uv run python scripts/eval_selection.py

