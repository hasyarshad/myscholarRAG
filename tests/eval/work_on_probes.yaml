# Probe set for questions about someone's work on a subject.
#
# A diagnostic set rather than a labelled one. routing_set.yaml has five
# synthesis questions, too few to tell whether a whole *family* of phrasings
# misroutes or whether one question happened to.
#
# Run: uv run python scripts/probe_routing.py
# Pinned by: tests/integration/test_routing_contract.py
#
# Design: four phrasings crossed with five topics, so a phrasing effect can be
# separated from a topic effect.
#
#   A  "talk to me about his work related to X"
#   B  "tell me about his X work"
#   C  "what has he done on X?"
#   D  "how has his work on X developed over time?"
#
# D is a within-set positive control: it states multiplicity outright, which is
# the cue the gold synthesis cases in routing_set.yaml share. Because D covers
# the same five topics as A-C, comparing them separates "the phrasing lacks a
# multiplicity cue" from "the topic is too narrow to look like several papers".
#
# Every topic was checked against the corpus to span at least two papers, so
# single_paper_factual is a genuine misroute on all of them rather than a
# defensible reading. `papers_on_topic` records the count.

# --- chaos: 2 papers (jerk equation; chaos-based SVPWM) -----------------------
- question: "talk to me about his work related to chaos theory"
  kind: probe
  topic: chaos
  phrasing: A
  papers_on_topic: 2
- question: "tell me about his chaos work"
  kind: probe
  topic: chaos
  phrasing: B
  papers_on_topic: 2
- question: "what has he done on chaos?"
  kind: probe
  topic: chaos
  phrasing: C
  papers_on_topic: 2
- question: "how has his work on chaos developed over time?"
  kind: probe
  topic: chaos
  phrasing: D
  papers_on_topic: 2

