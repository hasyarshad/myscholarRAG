# --- controls -----------------------------------------------------------------
#
# Copied verbatim from routing_set.yaml with their existing gold labels. If a
# classifier-prompt change moves any of them, the change is too broad.
#
# The two bibliographic entries are the ones most exposed to an edit that widens
# synthesis: a counting question pulled into a content class is answered by
# retrieval, which fabricates a number instead of querying for one.
- question: "What optimisation algorithm does the weighting factors paper use?"
  kind: control
  expect: single_paper_factual
- question: "In the Reddit moderation study, what platform was analysed?"
  kind: control
  expect: single_paper_factual
- question: "What filter is used in the grid-tied inverter paper?"
  kind: control
  expect: single_paper_factual
- question: "Which machine does the meta-learner stacking paper diagnose?"
  kind: control
  expect: single_paper_factual
- question: "What sampling frequency does the LSPMSM fault study use?"
  kind: control
  expect: single_paper_factual
- question: "In the UAV paper, which estimator is applied?"
  kind: control
  expect: single_paper_factual
- question: "Give me a count of his 2021 output"
  kind: control
  expect: bibliographic
- question: "How many journal articles has he written?"
  kind: control
  expect: bibliographic
